name: Deploy Parakeet AI → GitHub Pages

on:
  push:
    branches: ['claude/parakeet-ai-iphone-agent-lt7trj', 'main']
    paths:
      - 'parakeet-ai/**'
      - '.github/workflows/deploy-parakeet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: parakeet-ai/package-lock.json

      - name: Install dependencies
        run: cd parakeet-ai && npm ci

      - name: Build static site
        run: cd parakeet-ai && npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: '/lead_intelligence_agent'

      - name: Add .nojekyll
        run: touch parakeet-ai/out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: parakeet-ai/out
          branch: gh-pages
          clean: true
