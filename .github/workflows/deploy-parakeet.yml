name: Deploy Parakeet AI → GitHub Pages

on:
  push:
    branches: ['claude/parakeet-ai-iphone-agent-lt7trj', 'main']
    paths:
      - 'parakeet-ai/**'
      - '.github/workflows/deploy-parakeet.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: parakeet-ai/package-lock.json

      - name: Install dependencies
        run: cd parakeet-ai && npm ci

      - name: Build static site
        run: cd parakeet-ai && npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: '/lead_intelligence_agent'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: parakeet-ai/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
